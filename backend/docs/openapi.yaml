openapi: 3.0.3
info:
  title: Surf Mangalore Backend API
  version: 1.0.0
  description: Foundation API contract for the Surf Mangalore backend.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      summary: Health check endpoint
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
